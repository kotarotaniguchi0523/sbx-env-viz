# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
version: 2

project_name: sbxray

before:
  hooks:
    - go mod verify

builds:
  - id: sbxray
    main: ./cmd/sbxray
    binary: sbxray
    env:
      - CGO_ENABLED=0
    # macOS and Windows only. Linux users build from source (go install).
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    # tar.gz on Windows too: Windows 10 and later ship tar.exe, and mise
    # and packslip open tar.gz on every platform.
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: source
    artifacts: source
    cmd: cyclonedx-gomod
    args: ["app", "-json", "-licenses", "-output", "$document", "-main", "cmd/sbxray", ".."]
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.cdx.json"
    env:
      - CGO_ENABLED=0

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore:"
      - "^test:"
  groups:
    - title: 新機能
      regexp: '^feat'
      order: 0
    - title: 修正
      regexp: '^fix'
      order: 1
    - title: ドキュメント
      regexp: '^docs'
      order: 2
    - title: その他
      order: 999

release:
  github:
    owner: kotarotaniguchi0523
    name: sbxray
  prerelease: auto
  footer: |
    ### 検証方法
    ```sh
    shasum -a 256 -c {{ .ProjectName }}_{{ .Version }}_checksums.txt --ignore-missing
    gh attestation verify {{ .ProjectName }}_{{ .Version }}_darwin_arm64.tar.gz -R kotarotaniguchi0523/sbxray
    ```
    mise で入れると、署名付きの `packslip.sigstore.json` で検証してから展開します。
    ```sh
    mise use -g packslip:github.com/kotarotaniguchi0523/sbxray
    ```
