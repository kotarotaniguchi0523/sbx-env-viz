# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
capabilities:
  - type: com.docker.sandbox/host-mount@1
    config:
      path: /home/agent/.history
      mode: "0700"
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: [sh, -c, "ln -sf /home/agent/.history ${{ kit.env.HOME }}/.hist"]
          env: [HOME]
