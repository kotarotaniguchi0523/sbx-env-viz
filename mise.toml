# Pinned developer and CI toolchain. CI installs exactly these versions
# through jdx/mise-action, and mise.lock records their checksums.
[tools]
go = "1.27.4"
hk = "2.13.0"
pkl = "0.33.1"
betterleaks = "1.10.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"go:github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod" = "1.12.0"
"go:github.com/future-architect/uzomuzo-oss/cmd/uzomuzo" = "0.12.1"
trivy = "0.76.2"
goreleaser = "2.20.2"
# GitHub Actions linters. jactionlint installs through its signed packslip
# (mise verifies it); sisakulint builds from the Go module proxy, checked
# against the Go checksum database. shellcheck lets jactionlint check run:.
jactionlint = "2.6.0"
shellcheck = "0.11.0"
"go:github.com/gh-intel/sisakulint/cmd/sisakulint" = "0.4.0"

# Same rules as mac-host-setup: install only what mise.lock records, adopt a
# release only after it has been public for 2 days, and pin exact versions
# when a tool is added with `mise use`.
[settings]
lockfile = true
locked = true
minimum_release_age = "2d"
pin = true
experimental = true

[env]
# Use exactly the pinned Go above; never auto-download another toolchain.
GOTOOLCHAIN = "local"

[tasks.test]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks.build]
description = "Static build for the current platform"
run = "CGO_ENABLED=0 go build -trimpath -o dist/sbxray ./cmd/sbxray"

[tasks.e2e]
description = "Drive the built binary in a real PTY (Microsoft tui-test); UPDATE_SNAPSHOTS=1 rewrites baselines"
dir = "e2e/tui"
run = "go test -count=1 ./..."

[tasks.lint]
description = "gofmt check and go vet"
run = ['test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)', "go vet ./..."]

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with jactionlint (with shellcheck) and sisakulint"
run = ["jactionlint", "sisakulint"]

[tasks.audit]
description = "Supply-chain audit: govulncheck, SBOM, uzomuzo"
run = [
  "govulncheck ./...",
  "cyclonedx-gomod app -json -licenses -output sbom.cdx.json -main cmd/sbxray .",
  "uzomuzo scan --sbom sbom.cdx.json --show-transitive --fail-on eol-confirmed",
]

[tasks.snapshot]
description = "Build release archives locally without publishing (GoReleaser)"
run = "goreleaser release --snapshot --clean"
