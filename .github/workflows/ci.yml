name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

  tui-e2e:
    name: TUI e2e, real PTY (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go
      - name: go vet (e2e module)
        working-directory: e2e/tui
        run: go vet ./...
      - name: Drive the built binary in a real PTY (Microsoft tui-test)
        working-directory: e2e/tui
        run: go test -count=1 -v ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go
      - name: Cross build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
            -o "dist/sbx-env-viz_${GOOS}_${GOARCH}${ext}" ./cmd/sbx-env-viz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbx-env-viz_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  release-snapshot:
    name: GoReleaser check + snapshot
    # Releases ship macOS and Windows only, so run an archived binary here.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go goreleaser go:github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod
          # Never restore a cache into a job that builds release archives.
          cache: false
      - run: goreleaser check
      - name: Build every archive without publishing
        run: mise run snapshot
      - name: Exactly the archives .goreleaser.yaml promises, and the binary runs
        run: |
          shopt -s nullglob
          got="$(cd dist && printf '%s\n' ./*.tar.gz ./*.zip | sed -E 's|^\./||; s/_[^_]*SNAPSHOT[^_]*_/_/' | sort | tr '\n' ' ')"
          want="sbx-env-viz_darwin_amd64.tar.gz sbx-env-viz_darwin_arm64.tar.gz sbx-env-viz_source.tar.gz sbx-env-viz_windows_amd64.tar.gz sbx-env-viz_windows_arm64.tar.gz "
          if [ "$got" != "$want" ]; then
            echo "::error::archives: got [$got], want [$want]"; exit 1
          fi
          tar -xzf dist/*_darwin_arm64.tar.gz -C "$RUNNER_TEMP" sbx-env-viz
          "$RUNNER_TEMP/sbx-env-viz" --version | grep -q SNAPSHOT

  nix:
    name: Nix flake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Go 1.27.4 builds from source until nixpkgs ships it (nix/package.nix).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # First, so a stale vendorHash fails with its own message, not inside the package build.
      - name: vendorHash matches go.mod/go.sum
        run: tools/ci/vendor-hash.sh --check
      - name: nix flake check (builds the package, runs its --version check)
        run: nix flake check -L
      - name: nix run works as documented
        run: nix run . -- --version

  mise-lock:
    name: mise-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install: false
      - name: mise.lock matches mise.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/mise-lock.sh --check

  actions-lint:
    name: Lint workflows (jactionlint + sisakulint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go jactionlint shellcheck go:github.com/gh-intel/sisakulint/cmd/sisakulint
      - name: jactionlint (correctness, security, policy; shellcheck on run:)
        run: jactionlint --format github
      - name: sisakulint, online (impostor commits, known-vulnerable actions)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sisakulint --online --repo "$GITHUB_REPOSITORY"

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - run: govulncheck ./...
      - name: govulncheck (e2e module)
        working-directory: e2e/tui
        run: govulncheck ./...

  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: betterleaks
      - name: Scan full history
        run: betterleaks git --redact --no-banner .
      - name: Scan working tree
        run: betterleaks dir --redact --no-banner .
