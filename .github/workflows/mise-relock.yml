# Renovate (Mend hosted) cannot run `mise lock`, so its PRs that bump mise tools arrive without
# lockfile updates. This regenerates mise.lock on the PR branch, then dispatches ci.yml there
# (pushes made with GITHUB_TOKEN do not trigger workflows by themselves). Same as mac-host-setup.
name: mise-relock

on:
  pull_request:
    paths:
      - mise.toml

permissions: {}

concurrency:
  group: mise-relock-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  relock:
    name: relock
    # Only branches of this repository (Renovate). Fork PRs never get a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the regenerated lockfile to the PR branch
      actions: write # dispatch ci.yml on the PR branch
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true # needed to push to the PR branch
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install: false
          cache: false
      - name: regenerate mise.lock
        run: tools/ci/mise-lock.sh --write
      - name: push if changed
        run: |
          if git diff --quiet -- mise.lock; then
            echo "[i] mise.lock already up to date"; exit 0
          fi
          tools/ci/push-and-dispatch.sh "$HEAD_REF" "chore(deps): relock mise" mise.lock
