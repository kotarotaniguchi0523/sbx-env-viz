name: sbx release watch

on:
  schedule:
    - cron: "23 0 * * *" # daily, 09:23 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue instead of creating it
        type: boolean
        default: false
      force:
        description: Create the issue even if one already exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sbx-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open the update issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect a new stable sbx release and open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: "2"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash .github/scripts/sbx-watch.sh
