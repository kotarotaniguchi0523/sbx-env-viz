name: Release

# Push a tag to publish: git tag v0.1.0 && git push origin v0.1.0
#
# Every release is signed from this one file. Consumers that pinned the
# signer (mise's packslip backend, `packslip install --pin`) refuse a
# release signed by another workflow file, so keep signing here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Enforced by the cache service, not just by cache: false below: no job here can restore a
# cache into a release archive, or save one.
cache-mode: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the previous tag
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: go goreleaser go:github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod
          # Never restore a cache into a job that builds release archives.
          cache: false
      - name: go test -race
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
      - name: GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sign without write access to the release: the action can use its job's
  # token, so only a separate job keeps it from changing release assets.
  packslip:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # download the release assets
      id-token: write # sign keylessly with this workflow's identity
      attestations: write # attest build provenance of every archive
    steps:
      - uses: jdx/packslip@9d5b1c469ba90d26b6dbd0a0162e84a95da524d5 # v1.11.5
        id: packslip
        with:
          # Not the source archive: it has no executable to record.
          download: sbxray_*_darwin_*.tar.gz sbxray_*_windows_*.tar.gz
          bin: sbxray
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    needs: packslip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the bundle to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - name: Upload the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
