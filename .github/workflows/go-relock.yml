# Renovate cannot run Nix, so its PRs that bump Go modules arrive with a stale vendorHash in
# nix/package.nix. This recomputes it on the PR branch, then dispatches ci.yml there (pushes
# made with GITHUB_TOKEN do not trigger workflows by themselves). Mirrors mise-relock.yml.
name: go-relock

on:
  pull_request:
    paths:
      - go.mod
      - go.sum

permissions: {}

concurrency:
  group: go-relock-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  relock:
    name: relock vendorHash
    # Only branches of this repository (Renovate). Fork PRs never get a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the updated vendorHash to the PR branch
      actions: write # dispatch ci.yml on the PR branch
    # Go 1.27.4 builds from source until nixpkgs ships it (nix/package.nix).
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true # needed to push to the PR branch
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: recompute vendorHash
        run: tools/ci/vendor-hash.sh --write
      - name: push if changed
        run: |
          if git diff --quiet -- nix/package.nix; then
            echo "[i] vendorHash already up to date"; exit 0
          fi
          tools/ci/push-and-dispatch.sh "$HEAD_REF" "chore(deps): update vendorHash" nix/package.nix
